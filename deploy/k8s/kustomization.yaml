apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: alpha
resources:
  - namespace.yaml
  - postgres.yaml
  - rustfs.yaml
  - app.yaml
  - ingress.yaml
# CI меняет тег здесь: kustomize edit set image alpha-hackaton=<dockerhub-user>/alpha-hackaton:<sha>
images:
  - name: alpha-hackaton
    newName: DOCKERHUB_USER/alpha-hackaton
    newTag: latest
