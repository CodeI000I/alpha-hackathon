# Не коммитить с реальными значениями. Создать вручную:
#   kubectl -n alpha apply -f secrets.yaml
# Секрет для pull из приватного Docker Hub:
#   kubectl -n alpha create secret docker-registry dockerhub \
#     --docker-username=<user> --docker-password=<access-token>
apiVersion: v1
kind: Secret
metadata:
  name: alpha-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: change-me
  DATABASE_URL: postgres://app:change-me@postgres:5432/alpha?sslmode=disable
  S3_ACCESS_KEY: rustfsadmin
  S3_SECRET_KEY: change-me-too
