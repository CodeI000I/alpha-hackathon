# Образ приложения. repository и tag обновляет CI (.github/workflows/ci-cd.yaml) после каждой сборки main,
# Argo CD видит новый коммит и раскатывает его. Руками менять только для отката.
image:
  repository: devowt/alpha-hackaton
  tag: "a0370c4881fe87652c91daf8acf402ed3b6303c1"
  pullPolicy: IfNotPresent

# Секрет для pull из приватного Docker Hub, создаётся вручную (см. docs/cd-k3s.md).
imagePullSecrets:
  - name: dockerhub

# Secret с паролями, создаётся вручную из deploy/secrets.example.yaml.
# Ключи: POSTGRES_PASSWORD, S3_ACCESS_KEY, S3_SECRET_KEY; DATABASE_URL — только если postgres.enabled=false.
# Все ключи секрета попадают в окружение server и worker.
existingSecret: alpha-secrets

# Несекретные настройки приложения (ConfigMap). S3_ENDPOINT подставляется сам, если включён rustfs.
config:
  S3_BUCKET: company-files
  JEV_URL: ""         # адрес Jev (TypeSafe AI); пусто = заглушка по ключевым словам
  INGEST_PERIOD: 15m

server:
  replicas: 2
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

# Воркер — тот же образ с командой /app/worker. Одна реплика, чтобы не собирать новости дважды.
worker:
  enabled: true
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

service:
  port: 80

# k3s ставит Traefik как ingress-контроллер по умолчанию.
ingress:
  enabled: true
  className: ""                 # пусто = класс по умолчанию (traefik в k3s)
  host: alpha.devgit.net
  annotations: {}               # дополнительные аннотации Ingress, если понадобятся
  # HTTPS: сертификат для host выпускает cert-manager по существующему ClusterIssuer
  # и кладёт в Secret secretName.
  tls:
    enabled: true
    clusterIssuer: letsencrypt-production
    secretName: alpha-tls
  # Traefik Middleware redirectScheme: http → https (301). Работает только вместе с tls.enabled.
  redirectToHttps: true

postgres:
  enabled: true
  image: postgres:16-alpine
  user: app
  database: alpha
  storageClass: local-path      # провайдер томов, встроенный в k3s
  storage: 10Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

# RustFS — S3-совместимое хранилище файлов компаний (замена MinIO, чьи образы больше не публикуются на Docker Hub).
rustfs:
  enabled: true
  image: rustfs/rustfs:1.0.1
  storageClass: local-path
  storage: 10Gi
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
  # Если rustfs выключен, адрес внешнего S3:
  externalEndpoint: ""
