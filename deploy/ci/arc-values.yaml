# Значения для helm-чарта gha-runner-scale-set (раннеры GitHub Actions в кластере).
githubConfigUrl: https://github.com/OWNER/alpha-hackaton   # заменить OWNER
githubConfigSecret: github-arc                             # Secret с ключом github_token

minRunners: 0
maxRunners: 2

template:
  spec:
    serviceAccountName: deployer
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        command: ["/home/runner/run.sh"]
        resources:
          requests: { cpu: 100m, memory: 128Mi }
          limits: { memory: 1Gi }
