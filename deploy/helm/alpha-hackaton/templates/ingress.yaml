{{- if .Values.ingress.enabled }}
{{- $fullname := include "alpha.fullname" . }}
{{- $tls := .Values.ingress.tls }}
{{- $annotations := deepCopy (.Values.ingress.annotations | default dict) }}
{{- if and $tls.enabled $tls.clusterIssuer }}
{{- $_ := set $annotations "cert-manager.io/cluster-issuer" $tls.clusterIssuer }}
{{- end }}
{{- if and $tls.enabled .Values.ingress.redirectToHttps }}
{{- $_ := set $annotations "traefik.ingress.kubernetes.io/router.middlewares" (printf "%s-%s-redirect-https@kubernetescrd" .Release.Namespace $fullname) }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "alpha.labels" . | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if $tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ $tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}
                port: { name: http }
{{- end }}
