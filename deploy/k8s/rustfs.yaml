# RustFS — S3-совместимое хранилище файлов компаний (замена MinIO, чьи образы больше не публикуются на Docker Hub).
apiVersion: v1
kind: Service
metadata:
  name: rustfs
spec:
  selector: { app: rustfs }
  ports:
    - { name: s3, port: 9000 }
    - { name: console, port: 9001 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rustfs
spec:
  serviceName: rustfs
  replicas: 1
  selector:
    matchLabels: { app: rustfs }
  template:
    metadata:
      labels: { app: rustfs }
    spec:
      securityContext:
        fsGroup: 10001   # образ работает от пользователя rustfs (10001), том должен быть ему доступен
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.1
          env:
            - { name: RUSTFS_CONSOLE_ENABLE, value: "true" }
            - name: RUSTFS_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: alpha-secrets, key: S3_ACCESS_KEY } }
            - name: RUSTFS_SECRET_KEY
              valueFrom: { secretKeyRef: { name: alpha-secrets, key: S3_SECRET_KEY } }
          ports: [{ containerPort: 9000 }, { containerPort: 9001 }]
          readinessProbe:
            httpGet: { path: /health, port: 9000 }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests: { storage: 10Gi }
