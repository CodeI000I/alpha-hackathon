name: Pipeline tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: pipeline-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-backend-tests:
    name: Go backend and PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Create isolated integration databases
        env:
          PGPASSWORD: ci-only
        run: |
          createdb -h localhost -U postgres alpha_test
          createdb -h localhost -U postgres analytics_test_audit_backend

      - name: Test Go backend
        working-directory: backend
        env:
          ALPHA_TEST_DATABASE_URL: postgresql://postgres:ci-only@localhost:5432/alpha_test
          INGEST_TEST_DATABASE_URL: postgresql://postgres:ci-only@localhost:5432/analytics_test_audit_backend
        run: |
          go test -race ./... -count=1 -v 2>&1 | tee "$RUNNER_TEMP/go-tests.log"
          ! grep -Eq '^--- SKIP:|^[[:space:]]+--- SKIP:' "$RUNNER_TEMP/go-tests.log"

  python-tests:
    name: Python 3.12 and PostgreSQL 17 tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            orchestrator/requirements.txt
            orchestrator/analytics/requirements.txt
            parser_service/requirements-test.txt
            parser_service/requirements-ai.txt

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r orchestrator/analytics/requirements.txt -r parser_service/requirements-test.txt
          python -m pip check

      - name: Create isolated test databases
        env:
          PGPASSWORD: ci-only
        run: |
          python - <<'PY'
          from psycopg import connect, sql

          with connect('postgresql://postgres@localhost:5432/postgres', autocommit=True) as db:
              for name in ('orchestrator_core_ci', 'analytics_ci', 'kib_parser_test'):
                  db.execute(sql.SQL('CREATE DATABASE {}').format(sql.Identifier(name)))
          PY

      - name: Install the Cyrillic PDF test font
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fonts-dejavu-core tesseract-ocr

      - name: Prepare pinned OCR language data
        run: |
          python -m orchestrator.analytics.prepare_assets --ocr
          test -s orchestrator/data/tessdata/eng.traineddata
          test -s orchestrator/data/tessdata/rus.traineddata
          test -s /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf

      - name: Test core orchestrator with PostgreSQL
        env:
          ANALYTICS_TEST_DATABASE_URL: postgresql://postgres:ci-only@localhost:5432/orchestrator_core_ci
        run: |
          python -m unittest discover -s orchestrator/tests -q 2>&1 | tee "$RUNNER_TEMP/core-tests.log"
          ! grep -Eq 'skipped=[1-9]' "$RUNNER_TEMP/core-tests.log"

      - name: Test analytics with PostgreSQL and pgvector
        env:
          ANALYTICS_TEST_DATABASE_URL: postgresql://postgres:ci-only@localhost:5432/analytics_ci
        run: |
          python -m unittest discover -s orchestrator/analytics/tests -q 2>&1 | tee "$RUNNER_TEMP/analytics-tests.log"
          ! grep -Eq 'skipped=[1-9]' "$RUNNER_TEMP/analytics-tests.log"

      - name: Test parser service with PostgreSQL
        env:
          PARSER_TEST_DATABASE_URL: postgresql://postgres:ci-only@localhost:5432/kib_parser_test
        run: |
          python -m unittest discover -s parser_service/tests -q 2>&1 | tee "$RUNNER_TEMP/parser-tests.log"
          ! grep -Eq 'skipped=[1-9]' "$RUNNER_TEMP/parser-tests.log"
