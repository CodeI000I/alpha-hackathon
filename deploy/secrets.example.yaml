# Не коммитить с реальными значениями. Скопировать в secrets.yaml, вписать значения и создать вручную:
#   kubectl -n alpha apply -f deploy/secrets.yaml
# DATABASE_URL чарт собирает сам из POSTGRES_PASSWORD, поэтому пароль должен быть без символов,
# которые ломают URL (@ : / ? #). Подойдёт: openssl rand -hex 24
#
# Секрет для pull из приватного Docker Hub создаётся отдельно:
#   kubectl -n alpha create secret docker-registry dockerhub \
#     --docker-username=<user> --docker-password=<access-token>
apiVersion: v1
kind: Secret
metadata:
  name: alpha-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: change-me
  S3_ACCESS_KEY: rustfsadmin
  S3_SECRET_KEY: change-me-too
  # Тот же токен, что AI_SERVICE_TOKEN у оркестратора; без него оркестратор отвечает 401.
  ORCHESTRATOR_TOKEN: change-me-three
  # Токен POST /api/v1/internal/news (служебный импорт новостей). Пусто или нет ключа — маршрут выключен.
  INTERNAL_API_TOKEN: change-me-four
