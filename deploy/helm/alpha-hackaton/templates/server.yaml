apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "alpha.fullname" . }}
  labels:
    {{- include "alpha.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicas }}
  selector:
    matchLabels:
      {{- include "alpha.selector" (list . "server") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "alpha.selector" (list . "server") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: server
          image: {{ include "alpha.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "alpha.appEnv" . | nindent 10 }}
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "alpha.fullname" . }}
  labels:
    {{- include "alpha.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  selector:
    {{- include "alpha.selector" (list . "server") | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http }
