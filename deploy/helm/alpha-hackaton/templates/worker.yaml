{{- if .Values.worker.enabled }}
# Воркер — тот же образ с другой командой. Одна реплика и Recreate, чтобы не собирать новости дважды.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "alpha.fullname" . }}-worker
  labels:
    {{- include "alpha.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      {{- include "alpha.selector" (list . "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "alpha.selector" (list . "worker") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "alpha.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/worker"]
          {{- include "alpha.appEnv" . | nindent 10 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
{{- end }}
