# Образ Go backend/frontend. CI обновляет repository и tag после успешной сборки обоих образов.
image:
  repository: devowt/alpha-hackaton
  tag: "1a3e2912568e07e65be954302addb71d95b38934"
  pullPolicy: IfNotPresent

# Секрет для pull из приватного Docker Hub, создаётся вручную (см. docs/cd-k3s.md).
imagePullSecrets:
  - name: dockerhub

# Secret с паролями, создаётся вручную из deploy/secrets.example.yaml.
# Ключи: POSTGRES_PASSWORD, S3_ACCESS_KEY, S3_SECRET_KEY; DATABASE_URL — только если postgres.enabled=false;
# ORCHESTRATOR_TOKEN обязателен для Go → analytics вызова; AI_API_KEY нужен только для LLM-задач.
# INTERNAL_API_TOKEN защищает внутренний импорт и загрузку исходных документов.
existingSecret: alpha-secrets

# Несекретные настройки приложения (ConfigMap). S3_ENDPOINT подставляется сам, если включён rustfs.
config:
  S3_BUCKET: company-files
  SESSION_COOKIE_SECURE: "true"
  ORCHESTRATOR_URL: "" # заполняется именем analytics Service из Helm release
  ORCHESTRATOR_TIMEOUT: 5m # синхронный /rank: до двух вызовов LLM на каждую роль компании
  INGEST_PERIOD: 15m
  RANK_MAX_PER_RUN: 20 # оценок новостей за проход воркера: бережёт суточный бюджет LLM
  RANK_LOOKBACK: 168h # оцениваются новости, опубликованные за последнюю неделю
  ANALYTICS_CHECKPOINTS: "true"
  ANALYTICS_OPERATIONAL_RETENTION_DAYS: "30"
  ANALYTICS_TOP_K: "12"
  ANALYTICS_GRAPH_DEPTH: "2"
  ANALYTICS_GRAPH_ENABLED: "true"
  ANALYTICS_TRIAGE_ENABLED: "false"
  ANALYTICS_DEBOUNCE_SECONDS: "30"
  ANALYTICS_MAX_JOB_ATTEMPTS: "3"
  EMBEDDING_BACKEND: lexical
  PARSER_CONNECT_TIMEOUT_SECONDS: "5"
  PARSER_STATEMENT_TIMEOUT_MS: "10000"
  PARSER_LEASE_SECONDS: "150"
  PARSER_MAX_ATTEMPTS: "3"
  PARSER_CBR_ALLOW_FETCH: "false"
  PARSER_CBR_ALLOW_PERSIST: "false"
  PARSER_CBR_POLICY_VERSION: cbr-press-v1
  PARSER_CBR_USER_AGENT: AlphaHackathon/1.0
  PARSER_CBR_MAX_ITEMS: "10"
  PARSER_CBR_MAX_RESPONSE_BYTES: "2000000"
  PARSER_CBR_MAX_TOTAL_BYTES: "5000000"
  PARSER_CBR_REQUEST_TIMEOUT_SECONDS: "10"
  PARSER_CBR_JOB_TIMEOUT_SECONDS: "120"
  PARSER_CBR_MIN_INTERVAL_SECONDS: "1"

server:
  replicas: 2
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

# Воркер — тот же образ с командой /app/worker. Одна реплика, чтобы не собирать новости дважды.
worker:
  enabled: true
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

service:
  port: 80

# k3s ставит Traefik как ingress-контроллер по умолчанию.
ingress:
  enabled: true
  className: ""                 # пусто = класс по умолчанию (traefik в k3s)
  host: alpha.devgit.net
  annotations: {}               # дополнительные аннотации Ingress, если понадобятся
  # HTTPS: сертификат для host выпускает cert-manager по существующему ClusterIssuer
  # и кладёт в Secret secretName.
  tls:
    enabled: true
    clusterIssuer: letsencrypt-production
    secretName: alpha-tls
  # Traefik Middleware redirectScheme: http → https (301). Работает только вместе с tls.enabled.
  redirectToHttps: true

postgres:
  enabled: true
  image: pgvector/pgvector:pg16
  user: app
  database: alpha
  storageClass: local-path      # провайдер томов, встроенный в k3s
  storage: 10Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

# RustFS — S3-совместимое хранилище файлов компаний (замена MinIO, чьи образы больше не публикуются на Docker Hub).
rustfs:
  enabled: true
  image: rustfs/rustfs:1.0.1
  storageClass: local-path
  storage: 10Gi
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
  # Если rustfs выключен, адрес внешнего S3:
  externalEndpoint: ""

# Private in-cluster analytics API and background worker. API is not exposed by ingress.
analytics:
  enabled: true
  image:
    repository: devowt/alpha-hackaton
    tag: "analytics-1a3e2912568e07e65be954302addb71d95b38934"
    pullPolicy: IfNotPresent
  replicas: 1
  servicePort: 8090
  objectStorageClass: local-path
  objectStorage: 10Gi
  pollSeconds: 5
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }
  workerResources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }
  parser:
    enabled: false
    pollSeconds: 900
