apiVersion: v1
kind: ConfigMap
metadata:
  name: alpha-config
data:
  S3_ENDPOINT: rustfs:9000
  S3_BUCKET: company-files
  JEV_URL: ""         # адрес Jev (TypeSafe AI); пусто = заглушка по ключевым словам
  INGEST_PERIOD: 15m
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 2
  selector:
    matchLabels: { app: alpha }
  template:
    metadata:
      labels: { app: alpha }
    spec:
      imagePullSecrets: [{ name: dockerhub }]
      containers:
        - name: server
          image: alpha-hackaton
          envFrom:
            - configMapRef: { name: alpha-config }
            - secretRef: { name: alpha-secrets }
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
---
# Воркер — тот же образ с другой командой. Одна реплика, чтобы не собирать новости дважды.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: alpha-worker }
  template:
    metadata:
      labels: { app: alpha-worker }
    spec:
      imagePullSecrets: [{ name: dockerhub }]
      containers:
        - name: worker
          image: alpha-hackaton
          command: ["/app/worker"]
          envFrom:
            - configMapRef: { name: alpha-config }
            - secretRef: { name: alpha-secrets }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: app
spec:
  selector: { app: alpha }
  ports: [{ port: 80, targetPort: 8080 }]
