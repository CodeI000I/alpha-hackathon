# Пример .github/workflows/deploy.yml (положить, когда дойдём до Actions).
# Сборка идёт на раннере GitHub, деплой — на раннере внутри k3s.
name: build-and-deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ${{ vars.DOCKERHUB_USER }}/alpha-hackaton:${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: alpha-k3s          # имя helm-релиза gha-runner-scale-set
    steps:
      - uses: azure/setup-kubectl@v4
      # kubectl внутри пода сам берёт токен ServiceAccount deployer (in-cluster config).
      - run: |
          kubectl -n alpha set image deployment/app server=$IMAGE
          kubectl -n alpha set image deployment/worker worker=$IMAGE
          kubectl -n alpha rollout status deployment/app --timeout=180s
          kubectl -n alpha rollout status deployment/worker --timeout=180s
